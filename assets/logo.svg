<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Hexagon Gradient -->
    <linearGradient id="hexGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D26A" />
      <stop offset="100%" stop-color="#006633" />
    </linearGradient>
    <linearGradient id="hexGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#00994D" />
    </linearGradient>
    <linearGradient id="hexGradTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008040" />
      <stop offset="100%" stop-color="#00FF87" />
    </linearGradient>

    <!-- Central Obelisk Pillar Gradients -->
    <linearGradient id="pillarLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00994D" />
      <stop offset="100%" stop-color="#004D26" />
    </linearGradient>
    <linearGradient id="pillarRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73FFA6" />
      <stop offset="50%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#00B359" />
    </linearGradient>
    <linearGradient id="pillarTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E575" />
      <stop offset="100%" stop-color="#B8FFD9" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Outer Hexagon Frame -->
    <!-- Top-Left Segment -->
    <polygon points="250,40 85,135 85,165 250,70" fill="url(#hexGradTop)" />
    <!-- Left Vertical Segment -->
    <polygon points="85,135 85,365 115,348 115,152" fill="url(#hexGradLeft)" />
    <!-- Bottom-Left Segment -->
    <polygon points="85,365 250,460 250,425 115,348" fill="url(#hexGradLeft)" />
    <!-- Bottom-Right Segment -->
    <polygon points="250,460 415,365 385,348 250,425" fill="url(#hexGradRight)" />
    <!-- Right Vertical Segment -->
    <polygon points="415,365 415,135 385,152 385,348" fill="url(#hexGradRight)" />
    <!-- Top-Right Segment -->
    <polygon points="415,135 250,40 250,70 385,152" fill="url(#hexGradRight)" />

    <!-- Solid Outer Hex Shape for clean borders -->
    <!-- Outer rim outline -->
    <path d="M250,40 L415,135 L415,365 L250,460 L85,365 L85,135 Z" fill="none" stroke="#00FF87" stroke-width="4" opacity="0.3" filter="url(#neonGlow)" />

    <!-- Central Obelisk / Pillar -->
    <!-- Pillar Pyramid Top - Left Slope -->
    <polygon points="250,170 195,225 250,245" fill="url(#pillarTop)" opacity="0.85" />
    <!-- Pillar Pyramid Top - Right Slope -->
    <polygon points="250,170 250,245 305,225" fill="url(#pillarTop)" />

    <!-- Pillar Left Facet -->
    <polygon points="195,225 250,245 250,448 195,417" fill="url(#pillarLeft)" />

    <!-- Pillar Right Facet (Bright Glowing Face) -->
    <polygon points="250,245 305,225 305,417 250,448" fill="url(#pillarRight)" />

    <!-- Inner Core Glow Line -->
    <line x1="250" y1="170" x2="250" y2="448" stroke="#FFFFFF" stroke-width="3" opacity="0.6" />
  </g>
</svg>
